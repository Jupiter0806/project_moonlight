$kind: http-request
description: Follow-up question linked to an existing reflection session (uses
  `reflectionId` variable set by a previous request). Each call appends a new
  trace to the reflection.
url: "{{baseUrl}}/api/answer?user_id={{userId}}&reflection_id={{reflectionId}}&\
  question=Can you give me a practical example?"
method: GET
headers:
  Authorization: Bearer {{idToken}}
queryParams:
  - key: user_id
    value: "{{userId}}"
  - key: reflection_id
    value: "{{reflectionId}}"
    description: Chain follow-up questions to the same reflection session
  - key: question
    value: Can you give me a practical example?
order: 2000
