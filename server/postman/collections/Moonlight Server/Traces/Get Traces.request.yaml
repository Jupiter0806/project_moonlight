$kind: http-request
description: |-
  Returns paginated traces (Q&A pairs) for a given reflection.
  Returns 404 if the reflection doesn't exist or belongs to another user.

  Response shape:
  ```json
  {
    "pagination": { "size": 10, "cursor": "" },
    "entries": [
      { "id": "", "created_time": 0, "q": "", "a": "" }
    ]
  }
  ```
url: "{{baseUrl}}/api/traces?user_id={{userId}}&reflection_id={{reflectionId}}&\
  counts=10"
method: GET
headers:
  Authorization: Bearer {{idToken}}
queryParams:
  - key: user_id
    value: "{{userId}}"
  - key: reflection_id
    value: "{{reflectionId}}"
    description: ID of the reflection whose traces you want to fetch
  - key: counts
    value: "10"
    description: Number of results per page (1–100, default 10)
  - key: cursor
    value: ""
    disabled: true
    description: Opaque cursor from previous response. Leave empty for first page.
order: 1000
