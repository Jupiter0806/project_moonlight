$kind: http-request
description: Valid token but `user_id` query param doesn't match the token UID —
  should return HTTP 403.
url: "{{baseUrl}}/api/reflections?user_id=some-other-uid&counts=10"
method: GET
headers:
  Authorization: Bearer {{idToken}}
queryParams:
  - key: user_id
    value: some-other-uid
    description: Intentionally wrong — token UID won't match this
  - key: counts
    value: "10"
order: 2000
