name: Firestore Rules Changelog Guard

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "FIRESTORE_RULES_CHANGELOG.md"
      - ".github/workflows/firestore_rules_changelog_guard.yml"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce changelog entry for firestore rules changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          git fetch origin "$BASE_REF" --depth=1

          CHANGED_FILES="$(git diff --name-only "origin/$BASE_REF"...HEAD)"

          if ! echo "$CHANGED_FILES" | grep -q '^firestore.rules$'; then
            echo "No firestore.rules change detected. Guard passed."
            exit 0
          fi

          if ! echo "$CHANGED_FILES" | grep -q '^FIRESTORE_RULES_CHANGELOG.md$'; then
            echo "firestore.rules changed, but FIRESTORE_RULES_CHANGELOG.md was not updated."
            echo "Add a changelog line using:"
            echo "- [rules] YYYY-MM-DD: <summary>"
            exit 1
          fi

          if ! grep -q '^# Firestore Rules Changelog$' FIRESTORE_RULES_CHANGELOG.md; then
            echo "Missing header in FIRESTORE_RULES_CHANGELOG.md: # Firestore Rules Changelog"
            exit 1
          fi

          CHANGELOG_DIFF="$(git diff -U0 "origin/$BASE_REF"...HEAD -- FIRESTORE_RULES_CHANGELOG.md)"

          if ! echo "$CHANGELOG_DIFF" | grep -E '^\+\- \[rules\] [0-9]{4}-[0-9]{2}-[0-9]{2}: .+' >/dev/null; then
            echo "No valid firestore rules changelog entry found in FIRESTORE_RULES_CHANGELOG.md diff."
            echo "Expected added line format:"
            echo "+- [rules] YYYY-MM-DD: <summary>"
            exit 1
          fi

          echo "Firestore rules changelog guard passed."
