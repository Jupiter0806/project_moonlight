# This is a basic workflow to help you get started with Actions

name: Web CI

# Controls when the workflow will run
on:
  # Run on PRs targeting main or dev — pre-merge gate to catch issues before they land
  pull_request:
    branches:
      - main
      - dev
    # Run only when files under web/ change (or when the workflow itself changes)
    paths:
      - "web/**"
      - ".github/workflows/web_CI.yml"

  # Run on push to main or dev — post-merge safety net (catches squash-merge drift)
  push:
    branches:
      - main
      - dev
    paths:
      - "web/**"
      - ".github/workflows/web_CI.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    environment:
      name: firebase dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version-file: "web/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check required secrets
        run: |
          missing=()
          [[ -z "$NEXT_PUBLIC_FIREBASE_API_KEY" ]] && missing+=("NEXT_PUBLIC_FIREBASE_API_KEY")
          [[ -z "$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" ]] && missing+=("NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN")
          [[ -z "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" ]] && missing+=("NEXT_PUBLIC_FIREBASE_PROJECT_ID")
          [[ -z "$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" ]] && missing+=("NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET")
          [[ -z "$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" ]] && missing+=("NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID")
          [[ -z "$NEXT_PUBLIC_FIREBASE_APP_ID" ]] && missing+=("NEXT_PUBLIC_FIREBASE_APP_ID")
          [[ -z "$FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" ]] && missing+=("FIREBASE_SERVICE_ACCOUNT_KEY_BASE64")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are present."
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}

  # Unit tests run after build succeeds — no secrets needed since all Firebase
  # dependencies are mocked in Vitest
  test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version-file: "web/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
