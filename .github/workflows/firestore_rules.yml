name: Firestore Rules

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/firestore_rules.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/firestore_rules.yml"
  workflow_dispatch:

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    environment:
      name: firebase dev
    name: Validate rules syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: "auth"
        name: "Firebase Authentication"
        uses: "google-github-actions/auth@v3"
        with:
          project_id: "${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}"
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}" # This can be the raw JSON or Base64

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy Firestore rules (dev)
        run: firebase deploy --only firestore:rules --config firebase.json --dry-run --non-interactive

  deploy-dev:
    name: Deploy rules to Firebase dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: firebase dev
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: "auth"
        name: "Firebase Authentication"
        uses: "google-github-actions/auth@v3"
        with:
          project_id: "${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}"
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}" # This can be the raw JSON or Base64

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy Firestore rules (dev)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        run: firebase deploy --only firestore:rules --config firebase.json --non-interactive

  deploy-prod:
    name: Deploy rules to Firebase prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: firebase prod
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: "auth"
        name: "Firebase Authentication"
        uses: "google-github-actions/auth@v3"
        with:
          project_id: "${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}"
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}" # This can be the raw JSON or Base64

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy Firestore rules (prod)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        run: firebase deploy --only firestore:rules --config firebase.json --non-interactive
