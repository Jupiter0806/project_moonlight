version: 2
updates:
  # Keep GitHub Actions versions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    labels:
      - dependencies

  # Keep web dependencies up to date
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    target-branch: dev
    ignore:
      # ESLint 10 breaks eslint-plugin-react and eslint-plugin-tailwindcss.
      # Stay on v9 until plugins are compatible.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
