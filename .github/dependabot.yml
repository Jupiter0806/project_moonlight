version: 2
updates:
  # Keep GitHub Actions versions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    labels:
      - dependencies

  # Keep web dependencies up to date
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
